name: keepalive

# Render 무료 플랜은 15분 동안 요청이 없으면 서버를 재우고, 다음 접속 때
# 깨어나는 데 30초 넘게 걸린다. 사람이 들어올 만한 시간대에만 10분마다
# 두드려서 깨워 둔다 — 한국시간 07:00~18:50 (UTC 22:00~09:50).
on:
  schedule:
    - cron: "*/10 22-23,0-9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 깨우기
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://tabletop-online-ppzz.onrender.com/api/health)
          echo "health=$code"
          test "$code" = "200"
